<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chip and system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container">
            <h1>📚 Chip and System</h1>
            <p class="subtitle">2026 Summer - Learning Notes</p>
        </div>
    </header>

    <!-- 个人简介 -->
    <section class="profile">
        <div class="container">
            <div class="profile-card">
                <div class="avatar">👨‍🎓</div>
                <div class="profile-info">
                    <h2>关于我</h2>
                    <p>一位无名之辈</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 笔记列表 -->
    <section class="notes">
        <div class="container">
            <h2 class="section-title">📖 Notes</h2>
            <div class="notes-grid" id="notesGrid">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Summer</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>

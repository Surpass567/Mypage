<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑期学习成果展示 - 笔记分享</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container">
            <h1>📚 暑期学习成果展示</h1>
            <p class="subtitle">2026年暑期 · 学习笔记分享</p>
        </div>
    </header>

    <!-- 个人简介 -->
    <section class="profile">
        <div class="container">
            <div class="profile-card">
                <div class="avatar">👨‍🎓</div>
                <div class="profile-info">
                    <h2>关于我</h2>
                    <p>暑期期间系统学习了前端开发与编程基础，整理了以下学习笔记，欢迎老师指正交流。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 笔记列表 -->
    <section class="notes">
        <div class="container">
            <h2 class="section-title">📖 学习笔记</h2>
            <div class="notes-grid" id="notesGrid">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <p>&copy; 2026 暑期学习成果展示 · 感谢老师指导</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
